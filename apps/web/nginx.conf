server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 64k;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Re-resolve the API on every request so a recreated container is found again.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $upstream http://api:8000;
    proxy_pass $upstream;
  }

  # Hashed build output: cache hard, and never answer a missing asset with index.html.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    # The CSP lives here, not on /api/, so the Swagger UI proxied from the API still works.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
